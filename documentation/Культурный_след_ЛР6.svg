<svg xmlns="http://www.w3.org/2000/svg" width="794" height="1123" viewBox="0 0 794 1123"><rect width="794" height="1123" fill="white"/><g font-family="Arial" font-size="20" fill="black" stroke="black" stroke-width="1.5"><rect x="205" y="35" width="550" height="1040" fill="white"/><text x="480" y="69" stroke="none" text-anchor="middle" font-weight="bold">React приложение «Культурный след»</text><path d="M 130 270 L 335 130" fill="none"/><path d="M 130 270 L 335 210" fill="none"/><path d="M 130 270 L 335 290" fill="none"/><path d="M 130 270 L 335 370" fill="none"/><path d="M 130 270 L 335 450" fill="none"/><path d="M 130 740 L 335 580" fill="none"/><path d="M 130 740 L 335 670" fill="none"/><path d="M 130 740 L 335 760" fill="none"/><path d="M 130 740 L 335 850" fill="none"/><path d="M 130 740 L 335 940" fill="none"/><path d="M 85 680 L 85 360" fill="none"/><path d="M 85 344 L 77 360 L 93 360 Z" fill="white"/><circle cx="85" cy="227" r="15" fill="white"/><path d="M85 242 V282 M40 259 H130 M85 282 L49 317 M85 282 L121 317" fill="none"/><text x="85" y="343" text-anchor="middle" stroke="none">Гость</text><circle cx="85" cy="697" r="15" fill="white"/><path d="M85 712 V752 M40 729 H130 M85 752 L49 787 M85 752 L121 787" fill="none"/><text x="85" y="813" text-anchor="middle" stroke="none">Авторизованный</text><text x="85" y="837" text-anchor="middle" stroke="none">пользователь</text><ellipse cx="505" cy="130" rx="170" ry="30" fill="white"/><text x="505" y="136" text-anchor="middle" stroke="none">Просмотреть плитку</text><ellipse cx="505" cy="210" rx="170" ry="30" fill="white"/><text x="505" y="204" text-anchor="middle" stroke="none">Найти по дате</text><text x="505" y="228" text-anchor="middle" stroke="none">создания произведения</text><ellipse cx="505" cy="290" rx="170" ry="30" fill="white"/><text x="505" y="284" text-anchor="middle" stroke="none">Просмотреть отрывок</text><text x="505" y="308" text-anchor="middle" stroke="none">и перейти к следующему</text><ellipse cx="505" cy="370" rx="170" ry="30" fill="white"/><text x="505" y="376" text-anchor="middle" stroke="none">Зарегистрироваться</text><ellipse cx="505" cy="450" rx="170" ry="30" fill="white"/><text x="505" y="456" text-anchor="middle" stroke="none">Войти</text><ellipse cx="505" cy="580" rx="170" ry="30" fill="white"/><text x="505" y="574" text-anchor="middle" stroke="none">Создать черновик</text><text x="505" y="598" text-anchor="middle" stroke="none">с фото и видео</text><ellipse cx="505" cy="670" rx="170" ry="30" fill="white"/><text x="505" y="676" text-anchor="middle" stroke="none">Опубликовать отрывок</text><ellipse cx="505" cy="760" rx="170" ry="30" fill="white"/><text x="505" y="766" text-anchor="middle" stroke="none">Поставить или снять лайк</text><ellipse cx="505" cy="850" rx="170" ry="30" fill="white"/><text x="505" y="856" text-anchor="middle" stroke="none">Удалить свой отрывок</text><ellipse cx="505" cy="940" rx="170" ry="30" fill="white"/><text x="505" y="946" text-anchor="middle" stroke="none">Выйти</text></g></svg>